<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ document.original_name }}</title><style>body{font-family:Arial;margin:20px;text-align:center}iframe{width:100%;height:70vh;border:1px solid #ddd}button{padding:15px 30px;font-size:18px;margin:10px;cursor:pointer}</style></head><body><h2>{{ document.original_name }}</h2><img src="{{ url_for('qr_file',code=document.code) }}" width="180"><br><button onclick="sendPrint()">🖨️ Print Document</button><iframe src="{{ url_for('document_file',filename=document.stored_name) }}"></iframe><script>async function sendPrint(){const response=await fetch("{{ url_for('create_print_job') }}",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:"{{ document.code }}",copies:1})});const data=await response.json();alert(data.success?"Print job sent successfully!":(data.error||"Print failed"));}</script></body></html>
