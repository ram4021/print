<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Print System</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="container"><h1>QR Print System</h1><a class="button" href="{{ url_for('upload') }}">Upload Document</a><h2>Documents</h2>{% for doc in documents %}<div class="document"><div><strong>{{ doc.original_name }}</strong><br><small>{{ doc.code }}</small></div><div><a href="{{ url_for('print_document', code=doc.code) }}">Open</a> | <a href="{{ url_for('qr_file', code=doc.code) }}" download>QR</a></div></div>{% else %}<p>No documents uploaded.</p>{% endfor %}</main></body></html>
